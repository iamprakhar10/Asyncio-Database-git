[project]
name = "asyncio-database-git"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prakhar Singh", email = "prakhars156@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.1",
    "fastapi>=0.143.0",
    "ipykernel>=7.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.33.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "typing>=3.10.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
asyncio-database-git = "asyncio_database_git:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
